<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบติดตามสถานะและอายุการใช้งานอุปกรณ์คอมพิวเตอร์ด้วย QR Code</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--card:#FFFFFF;--text:#1B2430;--muted:#3D4756;--line:#DDE2EA;--line2:#C5CCD8;--navy:#17324F;--navy-text:#FFFFFF;--navy-sub:#C9D6E6;--head2:#ECEFF4;
  --ok:#1E6B2E;--ok-bg:#E3F2E5;--warn:#8A5200;--warn-bg:#FFF0D0;--info:#0A5C91;--info-bg:#DDEFFB;--bad:#B3261E;--bad-bg:#FCE4E2;--off:#4B5563;--off-bg:#E8EAEE;
  --dot-ok:#2E7D32;--dot-warn:#C77700;--dot-info:#0B6AA8;--dot-bad:#C62828;--dot-off:#5F6672;
  --tab-idle:#5B6675;--input-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141E;--card:#18202D;--text:#E8ECF4;--muted:#B4BECE;--line:#2C3648;--line2:#3B475C;--navy:#17324F;--head2:#222B3A;
    --ok:#7AD07F;--ok-bg:#16301A;--warn:#F2B45A;--warn-bg:#3A2A0B;--info:#7CC4F2;--info-bg:#0F2A3C;--bad:#FF8A8A;--bad-bg:#3D1A1A;--off:#B4BCC8;--off-bg:#262C38;
    --tab-idle:#9AA5B8;--input-bg:#18202D;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",Sarabun,"TH Sarabun New",Tahoma,"Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:var(--text)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line)}}

/* header */
.hd{position:relative;background:var(--navy);color:var(--navy-text);padding:calc(28px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;align-items:center;gap:10px}
.hd h1{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.hd .sub{font-size:14px;color:var(--navy-sub);margin-top:2px}
.hd .grow{flex:1;min-width:0}
.hd.back{padding:calc(22px + env(safe-area-inset-top,0px)) 12px 16px 12px;gap:4px}
.hd.back h1{font-size:20px}
.backbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:inherit;cursor:pointer;flex-shrink:0}
.rolechip{position:absolute;top:calc(5px + env(safe-area-inset-top,0px));right:14px;z-index:2;background:#fff;color:var(--navy);font-size:12px;font-weight:700;line-height:16px;padding:1px 10px;border-radius:99px}
.hd-btn{height:44px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:var(--navy);font-weight:700;cursor:pointer;font-size:15px;white-space:nowrap}
.hd-link{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;height:36px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.searchbar{background:var(--navy);padding:0 20px 16px}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;height:48px;color:#5B6675}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:#1B2430;height:100%}

/* content */
.ct{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat .l{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.stat .n{font-size:32px;font-weight:700;line-height:1.2}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec h2{margin:0;font-size:18px;font-weight:600}
.sec a,.sec button{font-size:14px;color:var(--navy);font-weight:600;background:none;border:0;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec a,:root:not([data-theme="light"]) .sec button{color:#7CC4F2}}
.col{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.item .t{font-size:16px;font-weight:600}
.item .m{font-size:14px;color:var(--muted)}
.item .m.bad{color:var(--bad);font-weight:500}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-off{background:var(--off-bg);color:var(--off)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.note{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;white-space:nowrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:14px;font-weight:500;padding:7px 14px;border-radius:99px;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 240px + 18px));width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(23,50,79,.35);cursor:pointer;z-index:5}

/* forms */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:14px;font-weight:600;color:var(--muted)}
.f input,.f select,.inp{height:48px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--input-bg);font-size:16px;width:100%;min-width:0}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--navy);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.pri):not(.danger){color:#9CC8F2}}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1 1 0;min-width:0}
.row>.fix{flex:0 0 auto}
.stickybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;gap:10px;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:6}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(14px + env(safe-area-inset-bottom,0px));z-index:6}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;color:var(--tab-idle);font-size:13px;font-weight:500;background:none;border:0;cursor:pointer}
.tab.on{color:var(--navy);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:#7CC4F2}}

/* login */
.login-top{background:var(--navy);color:#fff;padding:calc(72px + env(safe-area-inset-top,0px)) 28px 56px;display:flex;flex-direction:column;gap:14px}
.login-top h1{margin:0;font-size:28px;line-height:1.3}
.login-top p{margin:0;font-size:16px;color:var(--navy-sub)}
.login-card{margin:-28px 20px 0;padding:20px;border-radius:16px;display:flex;flex-direction:column;gap:14px}
.login-card h2{margin:0;font-size:20px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px}

/* scan */
.vf{position:relative;height:340px;border-radius:18px;background:#0F1B2B;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .box{position:relative;width:210px;height:210px}
.vf .c{position:absolute;width:44px;height:44px;border:5px solid #fff}
.vf .c1{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.vf .c2{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.vf .c3{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.vf .c4{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.vf .ln{position:absolute;left:14px;right:14px;top:50%;height:3px;background:#5AA0E0;border-radius:2px}
.vf .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#E8EDF5;font-size:15px;font-weight:500;padding:0 12px}

/* detail */
.kv{padding:6px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.qrcard{display:flex;gap:14px;align-items:center}
.qrcard canvas{width:120px;height:120px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.hist div{font-size:14px;color:var(--muted);padding:3px 0}
.hist b{color:var(--text)}

/* tables */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 76px 76px;font-size:15px;padding:7px 14px;border-top:1px solid var(--line)}
.tr.h{background:var(--head2);font-weight:600;font-size:14px;border-top:0;padding:8px 14px}
.tr.t{background:var(--head2);font-weight:700;border-top:1px solid var(--line2)}
.tr span:nth-child(n+2){text-align:center}

/* modal + toast */
#overlay{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 10px 14px;overflow-y:auto;z-index:20}
#overlay[hidden]{display:none}
.modal{background:var(--card);border-radius:16px;max-width:460px;width:100%;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:19px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* โหลดตัวถอดรหัส QR (jsQR): ลอง cdnjs -> jsDelivr -> ไฟล์ในโฟลเดอร์ (jsQR.min.js) */
(function(){
  var srcs=['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','jsQR.min.js'];
  function load(i){
    if(window.jsQR||i>=srcs.length)return;
    var s=document.createElement('script');s.src=srcs[i];
    s.onload=function(){if(!window.jsQR)load(i+1);};
    s.onerror=function(){load(i+1);};
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
<script>
/* minimal QR encoder: byte mode, EC level M, versions 1-6 (up to ~106 bytes) */
const QR=(function(){
const EXP=new Array(512).fill(0),LOG=new Array(256).fill(0);
let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d;}
for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
const gmul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
function rsGen(n){let g=[1];for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);g.forEach((c,j)=>{ng[j]^=c;ng[j+1]^=gmul(c,EXP[i]);});g=ng;}return g;}
function rs(data,n){const g=rsGen(n);let r=new Array(n).fill(0);for(const d of data){const f=d^r[0];r=r.slice(1).concat([0]);for(let i=0;i<n;i++)r[i]^=gmul(g[i+1],f);}return r;}
const VER={1:[26,10,[[1,16]]],2:[44,16,[[1,28]]],3:[70,26,[[1,44]]],4:[100,18,[[2,32]]],5:[134,24,[[2,43]]],6:[172,16,[[4,27]]]};
const ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34]};
function utf8(s){return Array.from(new TextEncoder().encode(s));}
function encode(text){
 const data=utf8(text);let v=0,ec=0,bl=null,cap=0;
 for(const k of Object.keys(VER)){const [tot,e,b]=VER[k];const c=b.reduce((a,p)=>a+p[0]*p[1],0);if(data.length+2<=c){v=+k;ec=e;bl=b;cap=c;break;}}
 if(!v)throw new Error('ข้อความยาวเกินไปสำหรับ QR');
 let bits='0100'+data.length.toString(2).padStart(8,'0')+data.map(b=>b.toString(2).padStart(8,'0')).join('');
 bits+='0'.repeat(Math.min(4,cap*8-bits.length));bits+='0'.repeat((8-bits.length%8)%8);
 const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8),2));
 const pad=[0xEC,0x11];let k=0;while(cw.length<cap){cw.push(pad[k%2]);k++;}
 const blocks=[];let pos=0;for(const [c,d] of bl){for(let i=0;i<c;i++){blocks.push(cw.slice(pos,pos+d));pos+=d;}}
 const ecs=blocks.map(b=>rs(b,ec));const fin=[];
 const mx=Math.max(...blocks.map(b=>b.length));
 for(let i=0;i<mx;i++)for(const b of blocks)if(i<b.length)fin.push(b[i]);
 for(let i=0;i<ec;i++)for(const e of ecs)fin.push(e[i]);
 const n=17+4*v;const M=Array.from({length:n},()=>new Array(n).fill(null));const F=Array.from({length:n},()=>new Array(n).fill(false));
 const setm=(r,c,val)=>{if(r>=0&&r<n&&c>=0&&c<n){M[r][c]=val;F[r][c]=true;}};
 function finder(r,c){for(let dr=-1;dr<8;dr++)for(let dc=-1;dc<8;dc++){const rr=r+dr,cc=c+dc;if(rr<0||rr>=n||cc<0||cc>=n)continue;
  if(dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))setm(rr,cc,1);else setm(rr,cc,0);}}
 finder(0,0);finder(0,n-7);finder(n-7,0);
 for(let i=8;i<n-8;i++){setm(6,i,i%2===0?1:0);setm(i,6,i%2===0?1:0);}
 const al=ALIGN[v];
 for(const r of al)for(const c of al){
  if((r===6&&c===6)||(r===6&&c===al[al.length-1])||(r===al[al.length-1]&&c===6))continue;
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)setm(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1?1:0);}
 setm(n-8,8,1);
 for(let i=0;i<9;i++){F[8][i]=true;F[i][8]=true;}
 for(let i=0;i<8;i++){F[8][n-1-i]=true;F[n-1-i][8]=true;}
 const bq=[];for(const b of fin)for(let i=0;i<8;i++)bq.push((b>>(7-i))&1);
 function place(mk){const G=M.map(r=>r.slice());let idx=0,up=true,c=n-1;
  while(c>0){if(c===6)c--;
   for(let t=0;t<n;t++){const r=up?n-1-t:t;for(const cc of [c,c-1]){if(!F[r][cc]){let bit=idx<bq.length?bq[idx]:0;idx++;if(mk(r,cc))bit^=1;G[r][cc]=bit;}}}
   up=!up;c-=2;}
  return G;}
 const masks=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>(((r+c)%2)+(r*c)%3)%2===0];
 function fmt(m){const d=m;let r=d<<10;for(let i=14;i>9;i--)if((r>>i)&1)r^=0x537<<(i-10);return((d<<10)|r)^0x5412;}
 function apply(G,m){const f=fmt(m);const b=[];for(let i=0;i<15;i++)b.push((f>>i)&1);
  for(let i=0;i<6;i++)G[i][8]=b[i];G[7][8]=b[6];G[8][8]=b[7];G[8][7]=b[8];
  for(let i=9;i<15;i++)G[8][14-i]=b[i];
  for(let i=0;i<8;i++)G[8][n-1-i]=b[i];
  for(let i=8;i<15;i++)G[n-15+i][8]=b[i];
  G[n-8][8]=1;return G;}
 function penalty(G){let p=0;const T=G[0].map((_,c)=>G.map(r=>r[c]));
  for(const g of [G,T])for(const row of g){let run=1;for(let i=1;i<n;i++){if(row[i]===row[i-1]){run++;if(run===5)p+=3;else if(run>5)p+=1;}else run=1;}}
  for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++)if(G[r][c]===G[r+1][c]&&G[r][c]===G[r][c+1]&&G[r][c]===G[r+1][c+1])p+=3;
  return p;}
 let best=null;for(let m=0;m<8;m++){const G=apply(place(masks[m]),m);const s=penalty(G);if(best===null||s<best[0])best=[s,G];}
 return best[1];
}
return {encode};
})();
if(typeof module!=='undefined')module.exports=QR;

</script>
<script>
/* ระบบติดตามสถานะและอายุการใช้งานอุปกรณ์คอมพิวเตอร์ด้วย QR Code
   UC-01 เข้าสู่ระบบ | UC-02 จัดการข้อมูลอุปกรณ์ | UC-03 สร้างและพิมพ์ QR Code
   UC-04 สแกน QR Code | UC-05 ปรับปรุงสถานะ | UC-06 ดูอายุการใช้งาน/แจ้งเตือน | UC-07 ออกรายงาน */
(function () {
'use strict';

/* ================= ค่าคงที่ ================= */
var STATUSES = ['ใช้งานปกติ', 'อยู่ระหว่างซ่อม', 'ชำรุด', 'จำหน่ายออก'];   // สถานะที่ผู้ใช้เลือกได้
var NEAR = 'ใกล้หมดอายุการใช้งาน';                                         // สถานะที่ระบบคำนวณให้
var ALL = ['ใช้งานปกติ', 'อยู่ระหว่างซ่อม', 'ชำรุด', NEAR, 'จำหน่ายออก'];
var CATS = ['คอมพิวเตอร์ตั้งโต๊ะ', 'โน้ตบุ๊ก', 'เครื่องพิมพ์', 'จอภาพ', 'อุปกรณ์เครือข่าย', 'อื่น ๆ'];
var PREFIX = { 'คอมพิวเตอร์ตั้งโต๊ะ': 'PC', 'โน้ตบุ๊ก': 'NB', 'เครื่องพิมพ์': 'PR', 'จอภาพ': 'MN', 'อุปกรณ์เครือข่าย': 'NW', 'อื่น ๆ': 'OT' };
var DEFAULT_LIFE_YEARS = 5;
var K = { items: 'qrt:items:v2', users: 'qrt:users:v2', alert: 'qrt:alert:v2', session: 'qrt:session:v2' };
var ROLE_LABEL = { admin: 'ผู้ดูแลระบบ', staff: 'เจ้าหน้าที่' };
var PERMS = { admin: ['manage', 'qr', 'report', 'users', 'scan', 'status', 'view'], staff: ['scan', 'status', 'view'] };

/* ================= สถานะของแอป ================= */

function parseD(s) { var p = String(s || '').split('-'); if (p.length !== 3) return null; var d = new Date(+p[0], +p[1] - 1, +p[2]); return isNaN(d) ? null : d; }
function monthsBetween(d1, d2) { var m = (d2.getFullYear() - d1.getFullYear()) * 12 + d2.getMonth() - d1.getMonth(); if (d2.getDate() < d1.getDate()) m--; return Math.max(0, m); }
function ageMonths(it) { var d = parseD(it.purchaseDate); return d ? monthsBetween(d, new Date()) : 0; }
function remainMonths(it) { return Math.round((Number(it.lifespanYears) || DEFAULT_LIFE_YEARS) * 12) - ageMonths(it); }
function fmtMonths(m) { var y = Math.floor(m / 12), r = m % 12; return (y ? y + ' ปี ' : '') + (r || !y ? r + ' เดือน' : ''); }
function fmtDate(s) { var d = parseD(s); return d ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '-'; }
function effStatus(it) { return (it.status === 'ใช้งานปกติ' && remainMonths(it) <= S.alert) ? NEAR : it.status; }
function badgeCls(s) { return { 'ใช้งานปกติ': 'b-ok', 'ใกล้หมดอายุการใช้งาน': 'b-warn', 'อยู่ระหว่างซ่อม': 'b-info', 'ชำรุด': 'b-bad', 'จำหน่ายออก': 'b-off' }[s] || 'b-off'; }
function badge(s) { return '<span class="badge ' + badgeCls(s) + '">' + esc(s === NEAR ? 'ใกล้หมดอายุ' : s) + '</span>'; }
function dotColor(s) { return { 'ใช้งานปกติ': 'var(--dot-ok)', 'ใกล้หมดอายุการใช้งาน': 'var(--dot-warn)', 'อยู่ระหว่างซ่อม': 'var(--dot-info)', 'ชำรุด': 'var(--dot-bad)', 'จำหน่ายออก': 'var(--dot-off)' }[s]; }
function remainText(it) { var r = remainMonths(it); return r < 0 ? 'เกินกำหนด ' + fmtMonths(-r) : 'เหลืออายุใช้งาน ' + fmtMonths(r); }
function ageLine(it) { var r = remainMonths(it); return 'ใช้งานมา ' + fmtMonths(ageMonths(it)) + ' · ' + (r < 0 ? 'เกินกำหนด ' + fmtMonths(-r) : 'เหลือ ' + fmtMonths(r)); }

/* ================= SHA-256 + บัญชีผู้ใช้ (UC-01) ================= */
/* SHA-256 (pure JS, works without a secure context). Input: JS string. Output: hex. */
function sha256hex(str){
  var ascii=unescape(encodeURIComponent(str));
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var m=Math.pow,mw=m(2,32),i,j,result='';
  var words=[],asl=ascii.length*8;
  var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
  var ic={};
  for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(m(c,.5)*mw)|0;k[pc++]=(m(c,1/3)*mw)|0;}}
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((asl/mw)|0);
  words[words.length]=(asl);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}
if(typeof module!=='undefined')module.exports=sha256hex;

function randSalt() { var a = new Uint8Array(8); (window.crypto || window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
function pwHash(salt, pw) { return sha256hex(salt + ':' + pw); }
function findUser(name) { name = String(name || '').trim().toLowerCase(); for (var i = 0; i < S.users.length; i++) if (S.users[i].username.toLowerCase() === name) return S.users[i]; return null; }
function addUser(username, pw, role) { var salt = randSalt(); S.users.push({ username: username, role: role, salt: salt, hash: pwHash(salt, pw) }); return saveUsers(); }
function validUser(u, p) {
  if (!/^[A-Za-z0-9_.-]{3,30}$/.test(u)) return 'ชื่อผู้ใช้ต้องเป็นตัวอักษรอังกฤษ/ตัวเลข 3-30 ตัว';
  if (String(p).length < 6) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  return '';
}
function login(u, p) {
  var user = findUser(u);
  if (!user || user.hash !== pwHash(user.salt, p)) return false;
  S.session = { username: user.username, role: user.role };
  try { sessionStorage.setItem(K.session, JSON.stringify(S.session)); } catch (e) {}
  return true;
}
function logout() { stopCam(); S.session = null; try { sessionStorage.removeItem(K.session); } catch (e) {} nav('login'); }

function drawQR(canvas, text, size) {
  var G = QR.encode(text), n = G.length, quiet = 2, cell = Math.max(2, Math.floor(size / (n + quiet * 2))), px = cell * (n + quiet * 2);
  canvas.width = px; canvas.height = px;
  var c = canvas.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, px, px); c.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (G[r][k]) c.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
}

  return p.then(function (r) {

    if (window.jsQR) { var cv = $('#grab'), x = cv.getContext('2d', { willReadFrequently: true }); cv.width = w; cv.height = h; x.drawImage(src, 0, 0, w, h); var d = x.getImageData(0, 0, w, h), q = window.jsQR(d.data, w, h); if (q) return q.data; }

}
function toggleCam() {

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return setScanMsg('เบราว์เซอร์นี้ไม่รองรับกล้อง กรุณาพิมพ์รหัสหรือเลือกรูป QR แทน');

      }, 300);
    });
  }).catch(function () { stopCam(); setScanMsg('เปิดกล้องไม่ได้ (ยังไม่ได้อนุญาต หรือหน้านี้ไม่รองรับกล้อง) — พิมพ์รหัสอุปกรณ์แทนได้'); });
}
function scanFile(f) {
  if (!f) return;
  if (!detector && !window.jsQR) { setScanMsg('ตัวถอดรหัส QR ยังโหลดไม่สำเร็จ (ต้องต่ออินเทอร์เน็ตและไม่ถูกบล็อก) — พิมพ์รหัสอุปกรณ์แทนได้'); toast('ตัวถอดรหัส QR ยังโหลดไม่สำเร็จ'); return; }
  createImageBitmap(f).then(function (bm) {
    var w = Math.min(1200, bm.width), h = Math.round(w * bm.height / bm.width);
    return decodeSource(bm, w, h).then(function (r) { if (r) handleCode(r); else { setScanMsg('ตัวถอดรหัสทำงานแล้วแต่ไม่พบ QR ในรูปนี้ — ใช้ไฟล์สติกเกอร์ที่ดาวน์โหลดจากแอปโดยตรง'); toast('ไม่พบ QR ในรูปนี้'); } });
  }).catch(function () { toast('เปิดรูปไม่ได้'); });
}

/* ================= เหตุการณ์ ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-nav],[data-act],[data-filter]'); if (!t) return;
  if (t.hasAttribute('data-filter')) { S.filter = t.getAttribute('data-filter'); render(); return; }
  var n = t.getAttribute('data-nav');
  if (n) { nav(n, t.getAttribute('data-code') || undefined); return; }
  var a = t.getAttribute('data-act'), c = t.getAttribute('data-code');
  if (a === 'logout') logout(); else if (a === 'cam') toggleCam(); else if (a === 'manual') handleCode($('#manual').value);
  else if (a === 'setstatus') setStatus(c); else if (a === 'sticker') downloadSticker(c); else if (a === 'del') delItem(c);
  else if (a === 'demo') addDemo(); else if (a === 'undemo') removeDemo(); else if (a === 'csv') exportCsv();
  else if (a === 'backup') { if (can('manage')) download('qr-tracker-backup.json', JSON.stringify(S.items, null, 2), 'application/json'); }
  else if (a === 'users') openUsers(); else if (a === 'closem') closeModal();
  else if (a === 'deluser') { var u = t.getAttribute('data-u'); if (can('users') && confirm('ลบบัญชี ' + u + ' ?')) { S.users = S.users.filter(function (x) { return x.username !== u; }); saveUsers(); openUsers(); toast('ลบบัญชีแล้ว'); } }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-nav]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'manual') handleCode(e.target.value);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.search = e.target.value; var pos = e.target.selectionStart; render(); var q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'am') { S.alert = parseInt(e.target.value, 10); jset(localStorage, K.alert, S.alert); render(); }
  else if (id === 'qrFile') { scanFile(e.target.files[0]); e.target.value = ''; }
  else if (id === 'restoreFile') { restore(e.target.files[0]); e.target.value = ''; }
  else if (id === 'fc' && !$('#fcode').readOnly) { $('#fcode').value = nextCode(e.target.value); }
});
document.addEventListener('submit', function (e) {
  var f = e.target, kind = f.getAttribute('data-form'); if (!kind) return; e.preventDefault();
  var err = $('#err'), err2 = $('#err2');
  if (kind === 'setup') {
    var u = $('#su').value.trim(), p = $('#sp').value, p2 = $('#sp2').value, m = validUser(u, p);
    if (m) { err.textContent = m; return; } if (p !== p2) { err.textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'; return; }
    if (addUser(u, p, 'admin') && login(u, p)) { toast('สร้างบัญชีผู้ดูแลระบบแล้ว'); nav('dash'); }
  } else if (kind === 'login') {
    if (login($('#lu').value, $('#lp').value)) nav('dash'); else err.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  } else if (kind === 'item') { if (can('manage')) submitItem(f); }
  else if (kind === 'newuser') {
    if (!can('users')) return;
    var nu = $('#nu').value.trim(), np = $('#np').value, mm = validUser(nu, np);
    if (mm) { err2.textContent = mm; return; } if (findUser(nu)) { err2.textContent = 'มีชื่อผู้ใช้นี้อยู่แล้ว'; return; }
    if (addUser(nu, np, $('#nr').value)) { toast('เพิ่มบัญชีแล้ว'); openUsers(); }
  }
});
$('#overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeModal(); });

/* ================= เริ่มต้น ================= */
S.items = jget(localStorage, K.items, {});
S.users = jget(localStorage, K.users, []);
var a0 = parseInt(jget(localStorage, K.alert, 6), 10); if (a0 > 0) S.alert = a0;
var ss = jget(sessionStorage, K.session, null);
if (ss && findUser(ss.username)) S.session = { username: ss.username, role: findUser(ss.username).role };
render();
})();

</script>
</body>
</html>
